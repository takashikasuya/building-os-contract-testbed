    reproducible_part: "definition structure and status counts (tests/offline/test_contract_suite.py)"
    results:
      - {item: "definition: 35 conditions, covered 21 / partial 7 / gap 5 / conflict 2", status: Pass,
         source: contract-suite/README.md, quote: "| **計** | **21** | **7** | **5** | **2** |"}
