    dependencies: {RI: 8c871466fff695761fcbedf52f1dcdb830f455db, tenant-portal: 45c82971c7dd157f286e065f5662a4ea0ed9e697}
    method: "every condition maps to tests and/or a gap; structural check re-runnable here; test-id evidence lives in private run records"
