# Machine-readable record of the published experiments.
#
# Source of truth: the original reports, imported verbatim (redacted, numbers unchanged) under results/source-reports/.
# Nothing here was re-run for this release. Every `quote` must occur verbatim in its `source` report; this is checked by
# tests/offline/test_results_traceability.py and tools/release_gate.py.
#
# status: Pass | Fail | Skip | Not Tested | Not Applicable (with reason). Skip / Not Tested are never counted as Pass.
# reproducibility:
#   offline-public      re-runnable from this repository alone
#   offline-private     offline re-analysis, but over recorded artifacts that are not published
#   live                needs live stacks (BOPTEST / hvac-sim, Nexus, RI, BDE) and a human approval; not reproducible here
schema_version: 1
source_commit: e7e020dfa9ecf1df5afbcb555b84f3f055473943
