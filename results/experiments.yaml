      - {item: "RI owner unit tests (ri-unit) executed by the testbed", status: Not Tested,
         source: contract-suite/README.md, quote: "**Testbed では実行していない**（Not Tested）"}
    limitations: ["derived from an unpublished paper's Table 5 (REVIEW: disclosure approval needed)"]

