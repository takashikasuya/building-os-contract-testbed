# Public export allowlist for building-os-contract-testbed.
#
# Only the files listed here may be published. `.gitignore` is NOT relied on.
# tools/release_gate.py fails when a tracked file is neither listed under `imported` nor under `authored`.
#
# source.repo is the private repository the material was taken from. It is recorded for provenance only;
# nothing in this repository needs access to it (tests, CI and the gate run on this tree alone).
schema_version: 1
source:
  repo: building-os-e2e            # private; not required to use this repository
  ref: bootstrap/initial-testbed   # default branch
  commit: e7e020dfa9ecf1df5afbcb555b84f3f055473943
  commit_date: "2026-11-22T12:20:26+09:00"
  excluded_unmerged: "draft PR #74 (PX4 stage 2 A live) and branches not merged into the commit above"

# Redaction applied by tools/export_reports.py to every `transform: redact` file. The concrete patterns are kept by the
# maintainer outside this tree (they are the identifiers being removed); only their categories are recorded here.
# Numbers are never touched: the export asserts that the multiset of digit sequences is identical before and after.
redaction_categories:
  - {category: approver-handle, replacement: "human:<approver>", reason: "personal identifier of the approving person"}
  - {category: private-github-owner, replacement: "private/", reason: "owner of private repositories"}
# Identifiers that must not appear anywhere in the published tree, as sha256 of the lower-case token (checked by the
# gate over every substring of that length inside each alphanumeric run).
forbidden_token_sha256:
  - {length: 6, sha256: 761433e960b63f4da95c61841bcefbcc478e0db5068921e25a55dfe5299e45b0}
  - {length: 7, sha256: e43f4e9ee1db5b76003e95325cc15c31e365ffb095d269fd2aa45d744b8f31c2}
# Files where the author's name is published on purpose (rights holder, citation, approval record). The forbidden-
# identifier check skips only these. Imported reports are never exempt (the gate fails if one is listed here).
attribution_files:
  - NOTICE.md
  - CITATION.cff
  - release/approvals.yaml
  - docs/license-candidates.md
  - docs/publication-audit.md

# Classification: PUBLIC = publish once the release gate passes; REVIEW = staged here but needs a recorded human
# decision in release/approvals.yaml before publication (see docs/publication-audit.md).
imported:
