  - {src: docs/verification/2026-11-08-b3-injection.md, dst: results/source-reports/verification/2026-11-08-b3-injection.md, transform: redact, class: REVIEW}
  - {src: docs/verification/2026-11-21-b11-contract-layers.md, dst: results/source-reports/verification/2026-11-21-b11-contract-layers.md, transform: redact, class: REVIEW}
  - {src: docs/verification/2026-11-21-b12-v3-validation.md, dst: results/source-reports/verification/2026-11-21-b12-v3-validation.md, transform: redact, class: REVIEW}
