[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bos-contract-testbed"
version = "0.1.0"
description = "Offline contract predicates, synthetic fixtures and result records for Building OS integration experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bos_contract_testbed = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests/offline", "tests/contract"]
addopts = "-p no:cacheprovider"
